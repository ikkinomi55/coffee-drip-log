<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4:6 Method Coffee Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .toast-enter { animation: fade-in-up 0.3s ease-out forwards; }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px) translateX(-50%); }
            100% { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
        .toggle-checkbox:checked { right: 0; border-color: #3B82F6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3B82F6; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-20">

<header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            BrewLog Pro <span class="text-xs text-blue-300 font-normal ml-2">4:6 Method</span>
        </h1>
        <div class="text-sm text-green-400 font-semibold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Cloud Sync Active
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- 左側：計算＆登録フォーム -->
    <section class="lg:col-span-5 space-y-6">
        <div class="glass-panel rounded-2xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                Recipe Calculator
            </h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">計算基準</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btn-type-beans" class="flex-1 px-4 py-2 text-sm font-medium rounded-l-lg border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors">豆の量 (g)</button>
                        <button type="button" id="btn-type-yield" class="flex-1 px-4 py-2 text-sm font-medium rounded-r-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">出来上がり (ml)</button>
                    </div>
                </div>

                <div>
                    <label id="input-label" class="block text-sm font-medium text-gray-700 mb-1">豆の量 (g)</label>
                    <input type="number" id="base-amount" value="15" min="1" class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500 transition-shadow">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">味の調整 (1, 2投目)</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btn-flavor-sweet" class="flex-1 px-4 py-2 text-sm font-medium rounded-l-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">甘味</button>
                        <button type="button" id="btn-flavor-normal" class="flex-1 px-4 py-2 text-sm font-medium border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors">通常</button>
                        <button type="button" id="btn-flavor-acidic" class="flex-1 px-4 py-2 text-sm font-medium rounded-r-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">酸味</button>
                    </div>
                </div>

                <div class="flex items-center justify-between py-2">
                    <span class="text-sm font-medium text-gray-700">アイスコーヒー (氷5:湯5)</span>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="is-ice-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10"/>
                        <label for="is-ice-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                </div>

                <div id="recipe-result" class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-white p-3 rounded-lg shadow-sm text-center">
                            <span class="block text-xs text-gray-500 mb-1">必要な豆</span>
                            <span id="res-beans" class="text-xl font-bold text-slate-800">0g</span>
                        </div>
                        <div class="bg-white p-3 rounded-lg shadow-sm text-center">
                            <span class="block text-xs text-gray-500 mb-1">総湯量</span>
                            <span id="res-water" class="text-xl font-bold text-slate-800">0ml</span>
                        </div>
                    </div>
                    
                    <div id="ice-section" class="mb-4 bg-blue-50 p-3 rounded-lg text-center hidden">
                        <span class="block text-xs text-blue-600 mb-1">サーバーにセットする氷</span>
                        <span id="res-ice" class="text-lg font-bold text-blue-800">0g</span>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-sm font-bold text-gray-700 flex justify-between">
                            <span>注湯スケジュール</span>
                            <span id="res-hot-water" class="text-xs text-gray-500">お湯: 0ml</span>
                        </h4>
                        <ul id="pour-list" class="text-sm space-y-1"></ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl shadow-sm p-6 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Save to Log
            </h2>
            <form id="log-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">豆の種類・銘柄</label>
                    <input type="text" id="log-beans-name" list="beans-list" placeholder="例: 澤井珈琲 エチオピア" required class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500">
                    <datalist id="beans-list"></datalist>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">挽目 (Timemore C3)</label>
                        <input type="number" id="log-grind" placeholder="例: 13" required class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">湯温 (℃)</label>
                        <input type="number" id="log-temp" value="92" class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 border-b pb-1">味わい評価 (1-5)</label>
                    <div class="space-y-3" id="rating-inputs-container"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">メモ (オプション)</label>
                    <textarea id="log-notes" rows="2" placeholder="気づきや豆の状態など" class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500"></textarea>
                </div>

                <!-- 処理中はボタンを無効化する仕組みを追加 -->
                <button type="submit" id="btn-submit" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-slate-800 active:scale-95 transition-all mt-4 disabled:opacity-50 disabled:cursor-not-allowed">
                    クラウドに記録を保存する
                </button>
            </form>
        </div>
    </section>

    <!-- 右側：ログ履歴 -->
    <section class="lg:col-span-7">
        <div class="glass-panel rounded-2xl shadow-sm p-6 border border-gray-100 min-h-full">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Cloud Logs
            </h2>
            <div id="logs-container" class="space-y-4">
                <div class="text-center text-gray-500 py-10 flex flex-col items-center gap-3">
                    <svg class="w-8 h-8 animate-spin text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    クラウドからデータを同期中...
                </div>
            </div>
        </div>
    </section>
</main>

<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>

<!-- モジュールとしてJSを読み込む（ES Modules） -->
<script type="module">
    // --- Firebase SDK のインポート ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // 1. Firebaseの初期化（設定情報）
    const firebaseConfig = {
        apiKey: "AIzaSyAtbibgICThaebwVaLMccxdv0a7QELd9D4",
        authDomain: "coffee-drip-log.firebaseapp.com",
        projectId: "coffee-drip-log",
        storageBucket: "coffee-drip-log.firebasestorage.app",
        messagingSenderId: "407013958359",
        appId: "1:407013958359:web:fb27f89df1a07642094692",
        measurementId: "G-LFKXHQV2FK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // 'coffeeLogs' という名前のコレクション（フォルダ）を参照する
    const logsCollectionRef = collection(db, 'coffeeLogs');

    // --- アプリケーションの状態管理 ---
    let inputMode = 'beans'; 
    let flavorMode = 'normal';
    let currentRecipe = null;
    let cloudLogs = []; // ローカルストレージではなくメモリ上でクラウドデータを保持

    const RATING_KEYS = [
        { id: 'acidity', label: '酸味' },
        { id: 'sweetness', label: '甘み' },
        { id: 'bitterness', label: '苦み' },
        { id: 'body', label: 'ボディ' },
        { id: 'aftertaste', label: '後味' }
    ];

    const DOM = {
        btnBeans: document.getElementById('btn-type-beans'),
        btnYield: document.getElementById('btn-type-yield'),
        btnFlavorSweet: document.getElementById('btn-flavor-sweet'),
        btnFlavorNormal: document.getElementById('btn-flavor-normal'),
        btnFlavorAcidic: document.getElementById('btn-flavor-acidic'),
        inputLabel: document.getElementById('input-label'),
        baseAmount: document.getElementById('base-amount'),
        isIceToggle: document.getElementById('is-ice-toggle'),
        resBeans: document.getElementById('res-beans'),
        resWater: document.getElementById('res-water'),
        resHotWater: document.getElementById('res-hot-water'),
        resIce: document.getElementById('res-ice'),
        iceSection: document.getElementById('ice-section'),
        pourList: document.getElementById('pour-list'),
        logForm: document.getElementById('log-form'),
        btnSubmit: document.getElementById('btn-submit'),
        logsContainer: document.getElementById('logs-container'),
        ratingContainer: document.getElementById('rating-inputs-container'),
        logNotes: document.getElementById('log-notes'),
        beansList: document.getElementById('beans-list')
    };

    // --- 計算ツールロジック（変更なし） ---
    function calculateRecipe() {
        const amount = parseFloat(DOM.baseAmount.value) || 0;
        const isIce = DOM.isIceToggle.checked;
        const beans = inputMode === 'beans' ? amount : amount / 15;
        const totalYield = inputMode === 'beans' ? amount * 15 : amount;
        const iceAmount = isIce ? totalYield * 0.5 : 0;
        const hotWaterAmount = isIce ? totalYield * 0.5 : totalYield;
        const phase40 = hotWaterAmount * 0.4;
        const phase60 = hotWaterAmount * 0.6;

        let p1, p2;
        if (flavorMode === 'sweet') { p1 = phase40 * 0.4; p2 = phase40 * 0.6; } 
        else if (flavorMode === 'acidic') { p1 = phase40 * 0.6; p2 = phase40 * 0.4; } 
        else { p1 = phase40 * 0.5; p2 = phase40 * 0.5; }

        currentRecipe = {
            beans: Number(beans.toFixed(1)),
            totalYield: Number(totalYield.toFixed(0)),
            isIce: isIce,
            iceAmount: Number(iceAmount.toFixed(0)),
            hotWaterAmount: Number(hotWaterAmount.toFixed(0)),
            flavor: flavorMode,
            pours: [
                { id: 1, type: '蒸らし/味調整', amount: p1, accum: p1 },
                { id: 2, type: '味調整', amount: p2, accum: p1 + p2 },
                { id: 3, type: '濃度調整', amount: phase60 / 3, accum: phase40 + (phase60 / 3) },
                { id: 4, type: '濃度調整', amount: phase60 / 3, accum: phase40 + (phase60 / 3) * 2 },
                { id: 5, type: '濃度調整', amount: phase60 / 3, accum: hotWaterAmount }
            ]
        };
        renderRecipeUI();
    }

    function renderRecipeUI() {
        if (!currentRecipe) return;
        DOM.resBeans.textContent = `${currentRecipe.beans}g`;
        DOM.resWater.textContent = `${currentRecipe.totalYield}ml`;
        DOM.resHotWater.textContent = `お湯: ${currentRecipe.hotWaterAmount}ml`;
        if (currentRecipe.isIce) {
            DOM.iceSection.classList.remove('hidden');
            DOM.resIce.textContent = `${currentRecipe.iceAmount}g`;
        } else {
            DOM.iceSection.classList.add('hidden');
        }
        DOM.pourList.innerHTML = currentRecipe.pours.map(pour => `
            <li class="flex justify-between items-center py-1 border-b border-gray-100 last:border-0">
                <div>
                    <span class="inline-block w-6 text-gray-400 font-bold">${pour.id}</span>
                    <span class="text-gray-600">${pour.type}</span>
                </div>
                <div class="text-right">
                    <span class="font-semibold text-slate-800">${pour.accum.toFixed(0)}ml</span>
                    <span class="text-xs text-gray-500 w-14 inline-block">(+${pour.amount.toFixed(0)}ml)</span>
                </div>
            </li>
        `).join('');
    }

    DOM.btnBeans.addEventListener('click', () => { inputMode = 'beans'; updateCalcUI(DOM.btnBeans, DOM.btnYield, '豆の量 (g)', 15); });
    DOM.btnYield.addEventListener('click', () => { inputMode = 'yield'; updateCalcUI(DOM.btnYield, DOM.btnBeans, '出来上がり湯量 (ml)', 225); });

    function updateCalcUI(activeBtn, inactiveBtn, labelText, defaultVal) {
        activeBtn.className = "flex-1 px-4 py-2 text-sm font-medium border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors " + (activeBtn === DOM.btnBeans ? "rounded-l-lg" : "rounded-r-lg");
        inactiveBtn.className = "flex-1 px-4 py-2 text-sm font-medium border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors " + (inactiveBtn === DOM.btnBeans ? "rounded-l-lg" : "rounded-r-lg");
        DOM.inputLabel.textContent = labelText;
        DOM.baseAmount.value = defaultVal;
        calculateRecipe();
    }

    function updateFlavorUI(mode) {
        flavorMode = mode;
        const active = "flex-1 px-4 py-2 text-sm font-medium border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors";
        const inactive = "flex-1 px-4 py-2 text-sm font-medium border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors";
        DOM.btnFlavorSweet.className = inactive + " rounded-l-lg";
        DOM.btnFlavorNormal.className = inactive;
        DOM.btnFlavorAcidic.className = inactive + " rounded-r-lg";
        if (mode === 'sweet') DOM.btnFlavorSweet.className = active + " rounded-l-lg";
        if (mode === 'normal') DOM.btnFlavorNormal.className = active;
        if (mode === 'acidic') DOM.btnFlavorAcidic.className = active + " rounded-r-lg";
        calculateRecipe();
    }
    
    DOM.btnFlavorSweet.addEventListener('click', () => updateFlavorUI('sweet'));
    DOM.btnFlavorNormal.addEventListener('click', () => updateFlavorUI('normal'));
    DOM.btnFlavorAcidic.addEventListener('click', () => updateFlavorUI('acidic'));
    DOM.baseAmount.addEventListener('input', calculateRecipe);
    DOM.isIceToggle.addEventListener('change', calculateRecipe);

    function generateRatingUI(prefix, defaultValues = {}) {
        return RATING_KEYS.map(item => {
            const val = defaultValues[item.id] || 3; 
            const buttons = [1, 2, 3, 4, 5].map(num => `
                <label class="cursor-pointer">
                    <input type="radio" name="${prefix}_${item.id}" value="${num}" class="peer sr-only" ${num === val ? 'checked' : ''}>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center border peer-checked:bg-yellow-400 peer-checked:text-white peer-checked:border-yellow-400 text-gray-400 hover:bg-gray-100 transition-colors">${num}</div>
                </label>
            `).join('');
            return `<div class="flex items-center justify-between"><span class="text-sm font-medium text-gray-600 w-16">${item.label}</span><div class="flex gap-2">${buttons}</div></div>`;
        }).join('');
    }
    DOM.ratingContainer.innerHTML = generateRatingUI('new');


    // --- Firestore データの読み込み (Real-time Sync) ---
    // 作成日時（createdAt）の降順（新しい順）でデータを取得するクエリを作成
    const q = query(logsCollectionRef, orderBy("createdAt", "desc"));
    
    // onSnapshotはクラウド側のデータが変更されるたびに自動で実行される「監視カメラ」です
    onSnapshot(q, (snapshot) => {
        cloudLogs = [];
        snapshot.forEach((doc) => {
            // FirestoreのドキュメントIDと中身を結合して配列に格納
            cloudLogs.push({ id: doc.id, ...doc.data() });
        });
        renderLogs();
        updateBeansDatalist();
    });

    function updateBeansDatalist() {
        const uniqueBeans = [...new Set(cloudLogs.map(log => log.beansName))];
        DOM.beansList.innerHTML = uniqueBeans.map(name => `<option value="${name}"></option>`).join('');
    }

    // --- Firestore へのデータ書き込み ---
    // 非同期処理 (async/await) を使用してクラウドとの通信待ちを行います
    DOM.logForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        DOM.btnSubmit.disabled = true;
        DOM.btnSubmit.textContent = '保存中...';

        const ratings = {};
        RATING_KEYS.forEach(item => {
            ratings[item.id] = parseInt(document.querySelector(`input[name="new_${item.id}"]:checked`).value, 10);
        });

        const newLogData = {
            beansName: document.getElementById('log-beans-name').value,
            grind: document.getElementById('log-grind').value,
            temp: document.getElementById('log-temp').value,
            notes: DOM.logNotes.value,
            ratings: ratings,
            recipe: currentRecipe,
            createdAt: serverTimestamp() // クラウドサーバー上の正確な時刻を記録
        };

        try {
            // addDoc関数で、指定したコレクションにデータを新規追加
            await addDoc(logsCollectionRef, newLogData);
            showToast('クラウドに記録を保存しました！');
            DOM.logForm.reset();
            DOM.ratingContainer.innerHTML = generateRatingUI('new');
            updateFlavorUI('normal');
        } catch (error) {
            console.error("Error adding document: ", error);
            showToast('保存に失敗しました', true);
        } finally {
            DOM.btnSubmit.disabled = false;
            DOM.btnSubmit.textContent = 'クラウドに記録を保存する';
        }
    });

    function renderLogs() {
        if (cloudLogs.length === 0) {
            DOM.logsContainer.innerHTML = `<div class="text-center text-gray-500 py-10">まだ記録がありません。</div>`;
            return;
        }

        DOM.logsContainer.innerHTML = cloudLogs.map(log => {
            // FirestoreのTimestamp型をJSのDate型に変換（まだ同期中のローカルデータはnullになることがあるためフォールバック処理）
            const logDate = log.createdAt ? log.createdAt.toDate() : new Date();
            const dateStr = logDate.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
            
            const typeBadge = log.recipe.isIce 
                ? '<span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-semibold">Ice</span>'
                : '<span class="bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded-full font-semibold">Hot</span>';
            const flavorLabels = { sweet: '甘味', normal: '通常', acidic: '酸味' };
            const flavorName = log.recipe.flavor ? flavorLabels[log.recipe.flavor] : '通常';

            const displayRatings = RATING_KEYS.map(item => `
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">${item.label}</span>
                    <div class="flex gap-1">
                        ${Array(5).fill(0).map((_, i) => `
                            <svg class="w-4 h-4 ${i < log.ratings[item.id] ? 'text-yellow-400' : 'text-gray-200'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            const notesHtml = log.notes ? `<div class="mt-3 p-3 bg-yellow-50 text-gray-700 text-sm rounded border border-yellow-100"><svg class="w-4 h-4 inline-block text-yellow-500 mr-1 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>${log.notes.replace(/\n/g, '<br>')}</div>` : '';

            // 修正：文字列IDを渡すため、シングルクォートで囲む onclick="window.toggleEditMode('${log.id}')"
            return `
                <div class="bg-white border border-gray-100 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-gray-800 flex items-center gap-2">${log.beansName} ${typeBadge}</h3>
                        <span class="text-xs text-gray-400">${dateStr}</span>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-sm text-gray-600 mb-4 bg-gray-50 p-2 rounded text-center">
                        <div><span class="block text-xs text-gray-400">豆量</span>${log.recipe.beans}g</div>
                        <div><span class="block text-xs text-gray-400">傾向</span>${flavorName}</div>
                        <div><span class="block text-xs text-gray-400">湯温</span>${log.temp}℃</div>
                        <div><span class="block text-xs text-gray-400">挽目</span>${log.grind}</div>
                    </div>
                    <div id="display-ratings-${log.id}" class="space-y-1 mb-3">${displayRatings}</div>
                    ${notesHtml}
                    <div id="edit-ratings-${log.id}" class="hidden space-y-3 mb-3 bg-white border p-3 rounded-lg">
                        <p class="text-xs font-bold text-gray-500 mb-2">評価を編集</p>
                        ${generateRatingUI(`edit_${log.id}`, log.ratings)}
                    </div>
                    <div class="flex justify-end gap-2 mt-2 border-t pt-3">
                        <button id="btn-edit-${log.id}" onclick="window.toggleEditMode('${log.id}')" class="text-sm px-3 py-1 text-slate-600 border border-slate-300 rounded hover:bg-slate-50 transition-colors">評価を修正する</button>
                        <button id="btn-save-${log.id}" onclick="window.saveEdit('${log.id}')" class="hidden text-sm px-3 py-1 bg-slate-800 text-white rounded hover:bg-slate-700 transition-colors">クラウドに確定</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // --- Firestore データの更新 ---
    window.toggleEditMode = function(id) {
        document.getElementById(`display-ratings-${id}`).classList.add('hidden');
        document.getElementById(`edit-ratings-${id}`).classList.remove('hidden');
        document.getElementById(`btn-edit-${id}`).classList.add('hidden');
        document.getElementById(`btn-save-${id}`).classList.remove('hidden');
    };

    window.saveEdit = async function(id) {
        const targetLog = cloudLogs.find(log => log.id === id);
        if(targetLog) {
            const updatedRatings = {};
            RATING_KEYS.forEach(item => {
                const checked = document.querySelector(`input[name="edit_${id}_${item.id}"]:checked`);
                if(checked) updatedRatings[item.id] = parseInt(checked.value, 10);
            });

            try {
                // updateDoc関数で、指定したドキュメント（ファイル）の中身の一部だけを更新する
                const logDocRef = doc(db, 'coffeeLogs', id);
                await updateDoc(logDocRef, { ratings: updatedRatings });
                showToast('クラウドの評価を更新しました');
            } catch (error) {
                console.error("Error updating document: ", error);
                showToast('更新に失敗しました', true);
            }
        }
    };

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        const bgColor = isError ? 'bg-red-600' : 'bg-slate-800';
        const iconColor = isError ? 'text-white' : 'text-green-400';
        toast.className = `toast-enter ${bgColor} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2`;
        toast.innerHTML = `<svg class="w-4 h-4 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${message}`;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    calculateRecipe();
</script>
</body>
</html>
