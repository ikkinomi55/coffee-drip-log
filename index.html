<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4:6 Method Coffee Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .toast-enter { animation: fade-in-up 0.3s ease-out forwards; }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px) translateX(-50%); }
            100% { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
        .toggle-checkbox:checked { right: 0; border-color: #3B82F6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3B82F6; }
        .tab-hidden { display: none !important; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="./favicon.ico" sizes="any">
</head>
<body class="text-gray-800 antialiased min-h-screen pb-24 sm:pb-8">

<header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 flex justify-between items-center h-16">
        <div class="flex items-center gap-6 h-full">
            <h1 class="text-lg font-bold flex items-center gap-1.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                BrewLog <span class="text-xs text-blue-300 font-normal mt-0.5">4:6</span>
            </h1>
            <!-- ログイン後にのみ表示されるナビゲーションタブ -->
            <nav id="desktop-nav" class="hidden space-x-4 h-full pt-1" aria-label="Tabs">
                <button onclick="switchTab('record')" id="tab-btn-record" class="border-b-2 border-blue-400 text-blue-400 px-2 h-full flex items-center text-sm font-medium transition-colors">記録する</button>
                <button onclick="switchTab('history')" id="tab-btn-history" class="border-b-2 border-transparent text-slate-400 hover:text-slate-300 px-2 h-full flex items-center text-sm font-medium transition-colors">履歴・検索</button>
            </nav>
        </div>

        <!-- 認証ステータス・ログアウトUI（ログイン後のみ表示） -->
        <div id="header-auth-area" class="hidden items-center gap-3">
            <div class="text-xs text-green-400 font-semibold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span class="hidden sm:inline">Cloud Sync</span>
            </div>
            <div class="flex items-center gap-2">
                <img id="user-avatar" src="" alt="User" class="w-7 h-7 rounded-full border border-slate-600 hidden">
                <span id="user-name" class="text-xs text-slate-300 hidden md:inline max-w-[140px] truncate"></span>
                <button type="button" id="btn-logout" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded border border-slate-700 transition-colors">
                    ログアウト
                </button>
            </div>
        </div>
    </div>
</header>

<!-- 1. 初期認証確認中画面（URL直打ち時も認証完了まで本体を描画しない） -->
<div id="auth-loading-screen" class="max-w-md mx-auto px-4 py-24 text-center">
    <div class="glass-panel rounded-2xl shadow-sm p-8 border border-gray-100 flex flex-col items-center gap-3">
        <svg class="w-8 h-8 animate-spin text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <p class="text-sm font-medium text-gray-600">認証状態を確認中...</p>
    </div>
</div>

<!-- 2. 未ログイン時専用画面（ログインボタンのみ表示） -->
<div id="login-gate-screen" class="hidden max-w-md mx-auto px-4 py-24">
    <div class="glass-panel rounded-2xl shadow-sm p-8 border border-gray-200 text-center">
        <div class="w-12 h-12 rounded-full bg-slate-900 text-white flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h2 class="text-lg font-bold text-slate-900 mb-2">BrewLog 4:6</h2>
        <p class="text-xs text-gray-500 mb-6">このアプリを利用するにはGoogleアカウントでのログインが必要です。</p>
        <button type="button" id="btn-login-gate" class="w-full inline-flex items-center justify-center gap-2.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-md transition-all">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
            Googleでログイン
        </button>
    </div>
</div>

<!-- 3. アプリ本体（初期状態はhidden：ログイン認証成功後にのみ表示） -->
<main id="app-main-container" class="hidden max-w-5xl mx-auto px-4 py-6">
    
    <!-- タブ1：計算＆登録フォーム -->
    <section id="tab-content-record" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <div class="glass-panel rounded-2xl shadow-sm p-5 border border-gray-100 h-fit">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                Recipe Calculator
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">種類</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btn-drink-black" class="flex-1 px-4 py-2 text-sm font-medium rounded-l-lg border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors">ブラック</button>
                        <button type="button" id="btn-drink-latte" class="flex-1 px-4 py-2 text-sm font-medium rounded-r-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">カフェラテ</button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">計算基準</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btn-type-beans" class="flex-1 px-4 py-2 text-sm font-medium rounded-l-lg border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors">豆の量 (g)</button>
                        <button type="button" id="btn-type-yield" class="flex-1 px-4 py-2 text-sm font-medium rounded-r-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">総量 (ml)</button>
                    </div>
                </div>

                <div>
                    <label id="input-label" class="block text-sm font-medium text-gray-700 mb-1">豆の量 (g)</label>
                    <input type="number" id="base-amount" value="15" min="1" class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500 transition-shadow">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">味の調整 (1, 2投目)</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btn-flavor-sweet" class="flex-1 px-4 py-2 text-sm font-medium rounded-l-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">甘味</button>
                        <button type="button" id="btn-flavor-normal" class="flex-1 px-4 py-2 text-sm font-medium border bg-slate-800 text-white border-slate-800 focus:outline-none transition-colors">通常</button>
                        <button type="button" id="btn-flavor-acidic" class="flex-1 px-4 py-2 text-sm font-medium rounded-r-lg border bg-white text-gray-700 border-gray-300 hover:bg-gray-50 focus:outline-none transition-colors">酸味</button>
                    </div>
                </div>

                <div class="flex items-center justify-between py-1">
                    <span class="text-sm font-medium text-gray-700">アイス (氷冷却)</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none">
                        <input type="checkbox" id="is-ice-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10"/>
                        <label for="is-ice-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                </div>

                <div id="recipe-result" class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                    <div class="grid grid-cols-2 gap-4 mb-3">
                        <div class="bg-white p-3 rounded-lg shadow-sm text-center">
                            <span class="block text-xs text-gray-500 mb-1">必要な豆</span>
                            <span id="res-beans" class="text-xl font-bold text-slate-800">0g</span>
                        </div>
                        <div class="bg-white p-3 rounded-lg shadow-sm text-center">
                            <span class="block text-xs text-gray-500 mb-1">ドリンク総量</span>
                            <span id="res-water" class="text-xl font-bold text-slate-800">0ml</span>
                        </div>
                    </div>
                    <div id="milk-section" class="mb-3 bg-orange-50 p-2.5 rounded-lg text-center hidden border border-orange-100">
                        <span class="block text-xs text-orange-600 mb-0.5">追加するミルク</span>
                        <span id="res-milk" class="text-lg font-bold text-orange-800">0ml</span>
                    </div>
                    <div id="ice-section" class="mb-3 bg-blue-50 p-2.5 rounded-lg text-center hidden border border-blue-100">
                        <span class="block text-xs text-blue-600 mb-0.5">サーバーにセットする氷</span>
                        <span id="res-ice" class="text-lg font-bold text-blue-800">0g</span>
                    </div>
                    <div class="space-y-1.5">
                        <h4 class="text-sm font-bold text-gray-700 flex justify-between">
                            <span>注湯スケジュール</span>
                            <span id="res-hot-water" class="text-xs text-gray-500">お湯: 0ml</span>
                        </h4>
                        <ul id="pour-list" class="text-sm space-y-1"></ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl shadow-sm p-5 border border-gray-100 h-fit">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Save to Log
            </h2>
            <form id="log-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">抽出日時 (未入力で現在時刻)</label>
                    <input type="datetime-local" id="log-datetime" class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">豆の種類・銘柄</label>
                    <input type="text" id="log-beans-name" list="beans-list" placeholder="例: 澤井珈琲 エチオピア" required class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm">
                    <datalist id="beans-list"></datalist>
                </div>
                
                <!-- 挽目・湯温：デフォルト18 / 83℃ ＋ リスト選択と数値直接入力のハイブリッドUI -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">挽目 (C3)</label>
                        <div class="flex gap-1.5">
                            <input type="number" id="log-grind" value="18" step="0.5" min="1" max="50" inputmode="decimal" required class="w-1/2 rounded-md border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm font-semibold">
                            <select id="log-grind-select" aria-label="挽目リスト選択" class="w-1/2 rounded-md border-gray-300 shadow-sm px-2 py-2 border bg-white focus:ring-slate-500 focus:border-slate-500 text-sm text-gray-700"></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">湯温 (℃)</label>
                        <div class="flex gap-1.5">
                            <input type="number" id="log-temp" value="83" step="0.5" min="40" max="100" inputmode="decimal" required class="w-1/2 rounded-md border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm font-semibold">
                            <select id="log-temp-select" aria-label="湯温リスト選択" class="w-1/2 rounded-md border-gray-300 shadow-sm px-2 py-2 border bg-white focus:ring-slate-500 focus:border-slate-500 text-sm text-gray-700"></select>
                        </div>
                    </div>
                </div>

                <!-- 5項目評価 ＋ 5項目合計リアルタイム表示 -->
                <div>
                    <div class="flex items-center justify-between mb-1.5 border-b pb-1.5">
                        <label class="block text-sm font-medium text-gray-700">味わい評価 (1-5)</label>
                        <div class="bg-amber-50 border border-amber-200 px-2.5 py-0.5 rounded-full text-xs font-bold text-amber-800">
                            5項目合計: <span id="new-rating-sum" class="text-sm text-amber-900">15</span> / 25点
                        </div>
                    </div>
                    <div class="space-y-2.5 mt-2" id="rating-inputs-container"></div>
                </div>

                <!-- 総合点 (100点満点の手入力) -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="flex items-center justify-between gap-3">
                        <div>
                            <label for="log-overall-score" class="block text-sm font-bold text-slate-800">総合点 (100点満点)</label>
                            <span class="text-[11px] text-gray-500">主観での総合評価を数値入力</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <input type="number" id="log-overall-score" min="0" max="100" step="1" placeholder="85" inputmode="numeric" class="w-24 text-right rounded-md border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-base font-bold text-slate-900">
                            <span class="text-sm font-medium text-gray-600">点</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">メモ (オプション)</label>
                    <textarea id="log-notes" rows="2" placeholder="気づきや豆の状態など" class="w-full rounded-md border-gray-300 shadow-sm px-4 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm"></textarea>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-lg shadow-md hover:bg-slate-800 active:scale-95 transition-all mt-3 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    クラウドに記録を保存する
                </button>
            </form>
        </div>
    </section>

    <!-- タブ2：ログ履歴・検索 -->
    <section id="tab-content-history" class="tab-hidden">
        <!-- 検索・絞り込み・ソート -->
        <div class="glass-panel rounded-2xl shadow-sm p-5 border border-gray-100 mb-5">
            <div class="flex items-center gap-2 mb-4 text-gray-600 font-semibold border-b pb-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                検索・絞り込み・並び替え
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">豆の名前で検索</label>
                    <input type="text" id="search-text" placeholder="キーワード入力..." class="w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">ドリンク種類</label>
                    <select id="filter-drink" class="w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm bg-white">
                        <option value="all">すべて</option>
                        <option value="black">ブラック</option>
                        <option value="latte">カフェラテ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">抽出温度</label>
                    <select id="filter-temp" class="w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm bg-white">
                        <option value="all">すべて</option>
                        <option value="hot">Hot</option>
                        <option value="ice">Ice</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">並び替え基準</label>
                    <select id="sort-criteria" class="w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-slate-500 focus:border-slate-500 text-sm bg-white">
                        <option value="date">抽出日時</option>
                        <option value="overallScore">総合点 (100点満点)</option>
                        <option value="ratingSum">5項目合計点</option>
                        <option value="sweetness">甘み評価</option>
                        <option value="acidity">酸味評価</option>
                        <option value="bitterness">苦み評価</option>
                        <option value="body">ボディ評価</option>
                        <option value="aftertaste">後味評価</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">順序</label>
                    <button type="button" id="btn-sort-order" class="w-full bg-white border border-gray-300 rounded shadow-sm px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 focus:outline-none flex justify-between items-center transition-colors">
                        <span>降順 (新しい/高い順)</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- CSV エクスポート / インポートパネル -->
        <div class="glass-panel rounded-2xl shadow-sm p-5 border border-gray-100 mb-6">
            <div class="flex items-center justify-between mb-3 border-b pb-2">
                <div class="flex items-center gap-2 text-gray-600 font-semibold text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    CSVバックアップ・移行
                </div>
                <span id="log-count-badge" class="text-xs text-gray-500">0件</span>
            </div>
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <button type="button" id="btn-export-csv" class="inline-flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-sm transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        CSVエクスポート
                    </button>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="flex items-center gap-4 text-xs font-medium text-gray-700">
                        <label class="inline-flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="csv-import-mode" value="append" checked class="text-blue-600 focus:ring-blue-500">
                            <span>追記する</span>
                        </label>
                        <label class="inline-flex items-center gap-1.5 cursor-pointer text-red-700">
                            <input type="radio" name="csv-import-mode" value="overwrite" class="text-red-600 focus:ring-red-500">
                            <span>上書き変更する</span>
                        </label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="file" id="csv-file-input" accept=".csv,text/csv" class="hidden">

        if (unsubscribeLogs) {

        currentUser = user;
        DOM.authLoadingScreen.classList.add('hidden');

        if (user) {
            // ログインゲートを隠し、アプリ本体とナビゲーションを表示

    // 挽目・湯温のハイブリッド入力（数値直接入力 ＋ リスト選択の双方向同期）
    function populateSelectOptions(selectEl, min, max, step, unit, defaultVal) {
        let html = `<option value="">リスト選択</option>`;
        for (let v = min; v <= max; v += step) {
            const selected = Number(v) === Number(defaultVal) ? 'selected' : '';
            html += `<option value="${v}" ${selected}>${v}${unit}</option>`;
        }
        selectEl.innerHTML = html;
    }

    function bindHybridInput(numberInput, selectInput) {
        selectInput.addEventListener('change', () => {
            if (selectInput.value !== '') {
                numberInput.value = selectInput.value;
            }
        });
        numberInput.addEventListener('input', () => {
            const val = numberInput.value;
            const matchOption = Array.from(selectInput.options).find(opt => opt.value === val);
            selectInput.value = matchOption ? val : '';
        });
    }

    // 4:6メソッド レシピ計算
    function calculateRecipe() {
        const amount = parseFloat(DOM.baseAmount.value) || 0;
        const isIce = DOM.isIceToggle.checked;
        const beans = inputMode === 'beans' ? amount : amount / 15;
        let baseYield = inputMode === 'beans' ? amount * 15 : amount;

        let milkAmount = 0;
        if (drinkType === 'latte') {
            milkAmount = baseYield * 0.5;
            baseYield = baseYield * 0.5;
        }

        const iceAmount = isIce ? baseYield * 0.5 : 0;
        const hotWaterAmount = isIce ? baseYield * 0.5 : baseYield;
        const phase40 = hotWaterAmount * 0.4;
        const phase60 = hotWaterAmount * 0.6;

        let p1, p2;
        if (flavorMode === 'sweet') { p1 = phase40 * 0.4; p2 = phase40 * 0.6; } 
        else if (flavorMode === 'acidic') { p1 = phase40 * 0.6; p2 = phase40 * 0.4; } 
        else { p1 = phase40 * 0.5; p2 = phase40 * 0.5; }

        currentRecipe = {
            drinkType: drinkType,
            beans: Number(beans.toFixed(1)),
            totalYield: Number((baseYield + milkAmount).toFixed(0)),
            isIce: isIce,
            iceAmount: Number(iceAmount.toFixed(0)),
            hotWaterAmount: Number(hotWaterAmount.toFixed(0)),
            milkAmount: Number(milkAmount.toFixed(0)),
            flavor: flavorMode,
            pours: [
                { id: 1, type: '蒸らし', amount: p1, accum: p1 },
                { id: 2, type: '味調整', amount: p2, accum: p1 + p2 },
                { id: 3, type: '濃度調整', amount: phase60 / 3, accum: phase40 + (phase60 / 3) },
                { id: 4, type: '濃度調整', amount: phase60 / 3, accum: phase40 + (phase60 / 3) * 2 },
                { id: 5, type: '濃度調整', amount: phase60 / 3, accum: hotWaterAmount }
            ]
        };
        renderRecipeUI();
    }

    function renderRecipeUI() {
        if (!currentRecipe) return;
        DOM.resBeans.textContent = `${currentRecipe.beans}g`;
        DOM.resWater.textContent = `${currentRecipe.totalYield}ml`;
        DOM.resHotWater.textContent = `お湯: ${currentRecipe.hotWaterAmount}ml`;
        
        if (currentRecipe.isIce) {
            DOM.iceSection.classList.remove('hidden');
            DOM.resIce.textContent = `${currentRecipe.iceAmount}g`;

            DOM.iceSection.classList.add('hidden');

            </li>
        `).join('');
    }

    function updateDrinkUI(mode) {
        drinkType = mode;

    function calcRatingSum(ratingsObj) {
        if (!ratingsObj) return 0;
        return RATING_KEYS.reduce((acc, item) => acc + (Number(ratingsObj[item.id]) || 0), 0);
    }

    function updateNewRatingSumDisplay() {
        let sum = 0;

            if (checked) sum += parseInt(checked.value, 10);

    function generateRatingUI(prefix, defaultValues = {}) {
        return RATING_KEYS.map(item => {
            const val = defaultValues[item.id] || 3; 
            const buttons = [1, 2, 3, 4, 5].map(num => `

                    <div class="w-8 h-8 rounded-full flex items-center justify-center border peer-checked:bg-yellow-400 peer-checked:text-white peer-checked:border-yellow-400 text-gray-400 hover:bg-gray-100 transition-colors text-sm">${num}</div>
                </label>
            `).join('');
            return `<div class="flex items-center justify-between"><span class="text-sm font-medium text-gray-600 w-12">${item.label}</span><div class="flex gap-1 sm:gap-1.5">${buttons}</div></div>`;
        }).join('');
    }
    DOM.ratingContainer.innerHTML = generateRatingUI('new');
    DOM.ratingContainer.addEventListener('change', updateNewRatingSumDisplay);
    updateNewRatingSumDisplay();

    // 五角形レーダーチャートSVG生成
    function renderPentagonRadarSVG(ratings = {}) {
        const cx = 115;
        const cy = 96;
        const maxR = 54;
        const levels = [1, 2, 3, 4, 5];

        const getCoords = (index, value) => {
            const angle = (-Math.PI / 2) + (index * 2 * Math.PI) / 5;
            const r = (value / 5) * maxR;
            return {
                x: cx + r * Math.cos(angle),
                y: cy + r * Math.sin(angle),
                angle
            };
        };

        const gridPolygons = levels.map(lvl => {
            const pts = RATING_KEYS.map((_, i) => {
                const c = getCoords(i, lvl);
                return `${c.x.toFixed(1)},${c.y.toFixed(1)}`;
            }).join(' ');
            return `<polygon points="${pts}" fill="none" stroke="${lvl === 5 ? '#CBD5E1' : '#E2E8F0'}" stroke-width="1" />`;
        }).join('');

        const axisLines = RATING_KEYS.map((_, i) => {
            const c = getCoords(i, 5);
            return `<line x1="${cx}" y1="${cy}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}" stroke="#E2E8F0" stroke-width="1" />`;
        }).join('');

        const dataCoords = RATING_KEYS.map((item, i) => {
            const val = Number(ratings[item.id]) || 0;
            return getCoords(i, val);
        });
        const dataPointsStr = dataCoords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');

        const dataDots = dataCoords.map(c => 
            `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="#D97706" />`
        ).join('');

        const labels = RATING_KEYS.map((item, i) => {
            const val = Number(ratings[item.id]) || 0;
            const c = getCoords(i, 5);
            const labelR = maxR + 16;
            const lx = cx + labelR * Math.cos(c.angle);
            const ly = cy + labelR * Math.sin(c.angle);
            
            let anchor = 'middle';
            if (Math.cos(c.angle) > 0.25) anchor = 'start';
            else if (Math.cos(c.angle) < -0.25) anchor = 'end';

            const dy = Math.sin(c.angle) > 0.5 ? 8 : (Math.sin(c.angle) < -0.5 ? -2 : 3);
            return `<text x="${lx.toFixed(1)}" y="${(ly + dy).toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="600" fill="#475569">${item.label}(${val})</text>`;
        }).join('');

        return `
            <svg viewBox="0 0 230 192" class="w-full max-w-[230px] h-auto mx-auto select-none">
                ${gridPolygons}
                ${axisLines}

    function applyFiltersAndSort() {
        if (!currentUser) return;
        const searchText = DOM.searchText.value.toLowerCase();
        const filterDrinkVal = DOM.filterDrink.value;
        const filterTempVal = DOM.filterTemp.value;
        const sortCriteriaVal = DOM.sortCriteria.value;

        filteredLogs = cloudLogs.filter(log => {
            const matchText = (log.beansName || '').toLowerCase().includes(searchText);
            let matchDrink = true;
            const logDrink = (log.recipe && log.recipe.drinkType) ? log.recipe.drinkType : 'black';
            if (filterDrinkVal !== 'all') matchDrink = logDrink === filterDrinkVal;
            let matchTemp = true;
            const isIce = log.recipe ? !!log.recipe.isIce : false;
            if (filterTempVal === 'hot') matchTemp = !isIce;
            if (filterTempVal === 'ice') matchTemp = isIce;
            return matchText && matchDrink && matchTemp;
        });

        filteredLogs.sort((a, b) => {
            let valA, valB;
            if (sortCriteriaVal === 'date') {
                valA = a.createdAt ? a.createdAt.toMillis() : 0;
                valB = b.createdAt ? b.createdAt.toMillis() : 0;
            } else if (sortCriteriaVal === 'overallScore') {
                valA = (a.overallScore !== undefined && a.overallScore !== null && a.overallScore !== '') ? Number(a.overallScore) : -1;
                valB = (b.overallScore !== undefined && b.overallScore !== null && b.overallScore !== '') ? Number(b.overallScore) : -1;
            } else if (sortCriteriaVal === 'ratingSum') {
                valA = calcRatingSum(a.ratings);
                valB = calcRatingSum(b.ratings);
            } else {
                valA = (a.ratings && a.ratings[sortCriteriaVal]) || 0;
                valB = (b.ratings && b.ratings[sortCriteriaVal]) || 0;
            }
            return (valB - valA) * (sortOrder === 'desc' ? 1 : -1);
        });

        DOM.logCountBadge.textContent = `${filteredLogs.length}件`;
        renderLogs();
    }

    function escapeCsvField(val) {
        if (val === null || val === undefined) return '';
        const str = String(val);
        if (str.includes('"') || str.includes(',') || str.includes('\n') || str.includes('\r')) {
            return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
    }

            return;
        }

        const headers = [
            '抽出日時', '豆の名前', 'ドリンク種類', 'アイス', '味調整',
            '豆量_g', '総量_ml', 'お湯_ml', 'ミルク_ml', '氷_g',
            '挽目', '湯温', '酸味', '甘み', '苦み', 'ボディ', '後味',
            '5項目合計', '総合点_100点満点', 'メモ'
        ];

        const rows = cloudLogs.map(log => {
            const dt = log.createdAt ? log.createdAt.toDate().toISOString() : '';
            const r = log.recipe || {};
            const rt = log.ratings || {};
            return [
                dt,
                log.beansName || '',
                r.drinkType || 'black',
                r.isIce ? 'true' : 'false',
                r.flavor || 'normal',
                r.beans ?? '',
                r.totalYield ?? '',

                log.notes || ''

        });

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const todayStr = new Date().toISOString().slice(0, 10);

        a.download = `coffee-drip-log_${todayStr}.csv`;

        URL.revokeObjectURL(url);

    });

    function parseCsvText(text) {
        const cleanText = text.replace(/^\uFEFF/, '');
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < cleanText.length; i++) {
            const char = cleanText[i];
            const nextChar = cleanText[i + 1];

            if (inQuotes) {
                if (char === '"' && nextChar === '"') {
                    field += '"';
                    i++;
                } else if (char === '"') {
                    inQuotes = false;
                } else {
                    field += char;
                }
            } else {
                if (char === '"') {
                    inQuotes = true;
                } else if (char === ',') {
                    row.push(field);
                    field = '';
                } else if (char === '\r' && nextChar === '\n') {
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                    i++;
                } else if (char === '\n' || char === '\r') {
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += char;
                }
            }
        }
        if (field !== '' || row.length > 0) {
            row.push(field);
            rows.push(row);
        }
        return rows.filter(r => r.some(cell => cell.trim() !== ''));
    }

    DOM.btnImportCsv.addEventListener('click', () => {

    DOM.csvFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;

        const mode = document.querySelector('input[name="csv-import-mode"]:checked').value;

        try {
            const text = await file.text();
            const parsedRows = parseCsvText(text);
            if (parsedRows.length < 2) {
                showToast('CSVにデータ行がありません', true);
                return;
            }

            const header = parsedRows[0].map(h => h.trim());
            const dataRows = parsedRows.slice(1);
            const idx = (name, fallbackIdx) => {
                const found = header.indexOf(name);
                return found !== -1 ? found : fallbackIdx;
            };

            const recordsToImport = dataRows.map(cols => {
                const dtStr = cols[idx('抽出日時', 0)];
                const parsedDate = dtStr ? new Date(dtStr) : new Date();
                const validDate = isNaN(parsedDate.getTime()) ? new Date() : parsedDate;

                const ratings = {
                    acidity: Number(cols[idx('酸味', 12)]) || 3,
                    sweetness: Number(cols[idx('甘み', 13)]) || 3,
                    bitterness: Number(cols[idx('苦み', 14)]) || 3,
                    body: Number(cols[idx('ボディ', 15)]) || 3,
                    aftertaste: Number(cols[idx('後味', 16)]) || 3
                };

                const rawOverall = (cols[idx('総合点_100点満点', 18)] ?? '').trim();
                const overallScore = rawOverall !== '' && !isNaN(Number(rawOverall)) ? Number(rawOverall) : null;

                return {
                    beansName: cols[idx('豆の名前', 1)] || '名称未設定',
                    grind: cols[idx('挽目', 10)] || String(DEFAULT_GRIND),
                    temp: cols[idx('湯温', 11)] || String(DEFAULT_TEMP),
                    notes: cols[idx('メモ', 19)] || '',
                    ratings: ratings,
                    ratingSum: calcRatingSum(ratings),
                    overallScore: overallScore,
                    recipe: {
                        drinkType: cols[idx('ドリンク種類', 2)] || 'black',
                        isIce: String(cols[idx('アイス', 3)]).toLowerCase() === 'true',
                        flavor: cols[idx('味調整', 4)] || 'normal',
                        beans: Number(cols[idx('豆量_g', 5)]) || 15,
                        totalYield: Number(cols[idx('総量_ml', 6)]) || 225,
                        hotWaterAmount: Number(cols[idx('お湯_ml', 7)]) || 225,
                        milkAmount: Number(cols[idx('ミルク_ml', 8)]) || 0,
                        iceAmount: Number(cols[idx('氷_g', 9)]) || 0
                    },
                    createdAt: Timestamp.fromDate(validDate)
                };
            });

            if (mode === 'overwrite') {
                const ok = confirm(`【上書き変更の確認】\n現在保存されている履歴をすべて削除し、CSVの ${recordsToImport.length} 件で置き換えます。よろしいですか？`);
                if (!ok) return;

                const existingSnap = await getDocs(getUserLogsRef(currentUser.uid));
                const existingDocs = existingSnap.docs;
                for (let i = 0; i < existingDocs.length; i += 450) {
                    const batch = writeBatch(db);
                    existingDocs.slice(i, i + 450).forEach(d => batch.delete(d.ref));
                    await batch.commit();
                }
            }

            const userLogsRef = getUserLogsRef(currentUser.uid);
            for (let i = 0; i < recordsToImport.length; i += 450) {
                const batch = writeBatch(db);
                recordsToImport.slice(i, i + 450).forEach(rec => {
                    const newDocRef = doc(userLogsRef);
                    batch.set(newDocRef, rec);
                });
                await batch.commit();
            }

            showToast(`${recordsToImport.length}件を${mode === 'overwrite' ? '上書き' : '追記'}インポートしました`);
        } catch (error) {
            console.error('CSV import error:', error);
            showToast('CSVのインポートに失敗しました', true);
        }
    });

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        const bgColor = isError ? 'bg-red-600' : 'bg-slate-800';
        const iconColor = isError ? 'text-white' : 'text-green-400';
        toast.className = `toast-enter ${bgColor} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2`;
        toast.innerHTML = `<svg class="w-4 h-4 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${message}`;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    calculateRecipe();
</script>
</body>
